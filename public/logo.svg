<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="rx-bg" x1="12" y1="8" x2="116" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#071022"/>
      <stop offset="55%" stop-color="#050b16"/>
      <stop offset="100%" stop-color="#030710"/>
    </linearGradient>
    <linearGradient id="rx-rim" x1="8" y1="8" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#22d3ee" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.85"/>
    </linearGradient>
    <radialGradient id="rx-glow" cx="64" cy="64" r="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.24"/>
      <stop offset="55%" stop-color="#10b981" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#050b16" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rx-x1" x1="36" y1="36" x2="92" y2="92" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="48%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="rx-x2" x1="92" y1="36" x2="36" y2="92" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="52%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="rx-laser" x1="14" y1="64" x2="114" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.2"/>
      <stop offset="18%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="82%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <!-- Obsidian Squircle Base -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#rx-bg)" stroke="url(#rx-rim)" stroke-width="3"/>
  <circle cx="64" cy="64" r="50" fill="url(#rx-glow)"/>

  <!-- Calibrated Vertical Axis Ticks -->
  <path d="M64 15V22M64 106V113" stroke="#38bdf8" stroke-opacity="0.35" stroke-width="2.5" stroke-linecap="round"/>

  <!-- 4 X-Ray Viewfinder Corner Brackets -->
  <g stroke="#38bdf8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M22 40V28a6 6 0 0 1 6-6h12"/>
    <path d="M88 22h12a6 6 0 0 1 6 6v12"/>
    <path d="M22 88v12a6 6 0 0 0 6 6h12"/>
    <path d="M88 106h12a6 6 0 0 0 6-6V88"/>
  </g>

  <!-- Bold Geometric X Blades -->
  <path d="M39 39L89 89" stroke="url(#rx-x1)" stroke-width="12" stroke-linecap="round"/>
  <path d="M89 39L39 89" stroke="url(#rx-x2)" stroke-width="12" stroke-linecap="round"/>

  <!-- Active Horizontal X-Ray Laser Scanline -->
  <line x1="14" y1="64" x2="114" y2="64" stroke="#10b981" stroke-opacity="0.34" stroke-width="11" stroke-linecap="round"/>
  <line x1="16" y1="64" x2="112" y2="64" stroke="url(#rx-laser)" stroke-width="4.5" stroke-linecap="round"/>

  <!-- Precision Center Focal Aperture -->
  <circle cx="64" cy="64" r="10.5" fill="#050b16" stroke="#34d399" stroke-width="4"/>
  <circle cx="64" cy="64" r="4.2" fill="#ffffff"/>
</svg>
