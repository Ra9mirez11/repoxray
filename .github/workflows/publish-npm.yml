name: Publish to npm with Provenance (OIDC)

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Ensure latest npm CLI for OIDC Trusted Publishing
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Run tests & build CLI
        run: npm test && npm run build:cli

      - name: Publish to npm via OIDC with cryptographic provenance
        run: npm publish --provenance --access public
