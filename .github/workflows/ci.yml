name: CI & RepoXray Self-Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Build Web & CLI bundles
        run: npm run build

      - name: Dogfood RepoXray Gate (Require Grade A+)
        run: node dist-cli/cli.mjs . --ci --fail-below 95
